version: '3.8'

services:
  backend:
    build: ./backend
    container_name: notesbuddy-backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/notesbuddy
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notesbuddy
      - ENVIRONMENT=local
      # Override individual params to ensure local DB is used
      - user=postgres
      - password=postgres
      - host=db
      - port=5432
      - dbname=notesbuddy
      # Add CORS for the new frontend port
      - BACKEND_CORS_ORIGINS=["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:5174", "http://127.0.0.1:5174"]
    depends_on:
      - db
    networks:
      - notesbuddy-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8001/api/v1
    container_name: notesbuddy-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - notesbuddy-network

  db:
    image: postgres:15-alpine
    container_name: notesbuddy-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notesbuddy
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - notesbuddy-network

volumes:
  postgres_data:


networks:
  notesbuddy-network:
    driver: bridge
